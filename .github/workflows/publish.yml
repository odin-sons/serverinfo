name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ServerInfo.sln

      - name: Build
        run: dotnet build ServerInfo.sln -c Release --no-restore

      # Tests (including the packaging validation tests) must pass before
      # anything gets published — a failure here stops the job here.
      - name: Test
        run: dotnet test ServerInfo.sln -c Release --no-build

      - name: Resolve and cross-check version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version_number -ne $version) {
            throw "Tag $tag (version $version) does not match manifest.json's version_number ($($manifest.version_number)). Bump the version everywhere (see CONTRIBUTING.md) before tagging."
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Thunderstore CLI
        run: dotnet tool install -g tcli

      - name: Build Thunderstore/Hexium package
        run: tcli build --package-version "${{ steps.version.outputs.version }}"

      # --file and --package-version are mutually exclusive on `tcli publish`
      # (the version is already baked into the zip from the build step above).
      # Tolerates "already exists" so a re-run after a later step fails
      # (e.g. Hexium) doesn't itself fail just because this step's own work
      # already landed the first time.
      - name: Publish to Thunderstore
        env:
          THUNDERSTORE_API_TOKEN: ${{ secrets.THUNDERSTORE_API_TOKEN }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = tcli publish `
            --file "build/Odin_Sons-ServerInfo-${{ steps.version.outputs.version }}.zip" `
            --token "$env:THUNDERSTORE_API_TOKEN" 2>&1 | Out-String
          Write-Output $output
          if ($LASTEXITCODE -ne 0) {
            if ($output -match "already exists") {
              Write-Output "This version is already published on Thunderstore — treating as success so the pipeline can be safely re-run."
            } else {
              exit $LASTEXITCODE
            }
          }

      # Hexium has no first-party publish tool, but it runs the same
      # multipart-upload + submit API Thunderstore does — verified against
      # Kesomannen/gale's open-source client (Kesomannen/gale, src-tauri/
      # src/thunderstore/{backend,models}.rs and profile/export/modpack.rs),
      # which uses this exact flow to publish to both backends:
      #   1. POST usermedia/initiate-upload/  -> upload_uuid + part URLs
      #   2. PUT each part's bytes to its URL -> capture the ETag header
      #   3. POST usermedia/{uuid}/finish-upload/ with the completed parts
      #   4. POST submission/submit/ with the package metadata
      - name: Publish to Hexium
        env:
          HEXIUM_API_TOKEN: ${{ secrets.HEXIUM_API_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $zipPath = "build/Odin_Sons-ServerInfo-$version.zip"
          $base = "https://hexium.gg/api/experimental"
          $headers = @{ Authorization = "Bearer $env:HEXIUM_API_TOKEN" }

          function Invoke-HexiumApi($Method, $Uri, $Body) {
            try {
              $json = $Body | ConvertTo-Json -Depth 10
              return Invoke-RestMethod -Method $Method -Uri $Uri -Headers $headers -ContentType "application/json" -Body $json
            } catch {
              $detail = $_.ErrorDetails.Message
              $message = "Hexium API call to $Uri failed: $($_.Exception.Message)"
              if ($detail) { $message = "$message`n$detail" }
              throw $message
            }
          }

          $fileBytes = [System.IO.File]::ReadAllBytes($zipPath)
          $fileName = Split-Path $zipPath -Leaf

          $initiate = Invoke-HexiumApi -Method Post -Uri "$base/usermedia/initiate-upload/" -Body @{
            filename         = $fileName
            file_size_bytes  = $fileBytes.Length
          }

          $uploadUuid = $initiate.user_media.uuid
          if (-not $uploadUuid) {
            throw "Hexium initiate-upload did not return a user_media.uuid"
          }

          $completedParts = @()
          foreach ($part in $initiate.upload_urls) {
            $chunk = $fileBytes[$part.offset..($part.offset + $part.length - 1)]
            $putResponse = Invoke-WebRequest -Method Put -Uri $part.url -Body $chunk -ContentType "application/octet-stream"
            $etag = $putResponse.Headers['ETag']
            if ($etag -is [array]) { $etag = $etag[0] }
            $completedParts += @{ ETag = $etag; PartNumber = $part.part_number }
          }

          Invoke-HexiumApi -Method Post -Uri "$base/usermedia/$uploadUuid/finish-upload/" -Body @{ parts = $completedParts } | Out-Null

          Invoke-HexiumApi -Method Post -Uri "$base/submission/submit/" -Body @{
            author_name           = "Odin_Sons"
            categories            = @()
            communities           = @("valheim")
            has_nsfw_content      = $false
            upload_uuid           = $uploadUuid
            community_categories  = @{ valheim = @() }
          } | Out-Null

          Write-Output "Published to Hexium: https://valheim.hexium.gg/mods/Odin_Sons/ServerInfo"

      # The GitHub Release body is this version's own CHANGELOG.md section —
      # what changed versus the previous published version, Conventional
      # Changelog style. PackagingValidationTests already fails the build
      # above if this section doesn't exist for the tagged version.
      - name: Extract changelog section for this version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[" + [regex]::Escape($version) + "\].*?\r?\n(.*?)(?=\r?\n## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
            throw "No '## [$version]' section found in CHANGELOG.md."
          }
          $notes = $match.Groups[1].Value.Trim()
          $notes += "`n`n---`nPublished automatically to [Thunderstore](https://thunderstore.io/package/Odin_Sons/ServerInfo/) and [Hexium](https://valheim.hexium.gg/mods/Odin_Sons/ServerInfo)."
          Set-Content -Path release-notes.md -Value $notes

      - name: Attach package to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "build/Odin_Sons-ServerInfo-${{ steps.version.outputs.version }}.zip" `
            --title "${{ github.ref_name }}" `
            --notes-file release-notes.md
        shell: pwsh
